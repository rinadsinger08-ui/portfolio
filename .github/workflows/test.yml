name: Pet Decider checks
on:
  push:
    paths:
      - 'projects/pet-decider/**'
      - 'browser-tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'projects/pet-decider/**'
      - 'browser-tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-results
          path: test-results/
